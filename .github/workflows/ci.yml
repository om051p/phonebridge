name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking needs the baseline commit, not a shallow checkout
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Pinned: an unpinned buf can change lint/breaking/generation behaviour
          version: "1.73.0"
      - name: Ensure local main ref exists (buf breaking baseline)
        run: git show-ref --verify --quiet refs/heads/main || git fetch --no-tags origin main:refs/heads/main
      # lint/generate run with CWD=proto/ — `out: ../core/pkg/protocol` in buf.gen.yaml is
      # resolved relative to the working directory; from the repo root it writes outside the
      # checkout and the drift gate below would pass vacuously.
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf generate
        working-directory: proto
        run: buf generate
      # Detects modified tracked output AND newly generated (untracked) files;
      # `git diff --exit-code` alone cannot see untracked files.
      - name: Drift gate — generated code must be committed
        run: |
          if [ -n "$(git status --porcelain -- core/pkg/protocol ui/lib/generated)" ]; then
            echo "::error::Generated code is stale. Run: cd proto && buf generate"
            git status --porcelain -- core/pkg/protocol ui/lib/generated
            git --no-pager diff -- core/pkg/protocol ui/lib/generated
            exit 1
          fi
      # Must run from the repo root: `.git#branch=main` resolves .git relative to the
      # working directory, and the baseline image is built with the repo root as module
      # root, so comparing from proto/ reports a false FILE_NO_DELETE.
      # `proto` (input) + `subdir=proto` (baseline) pin BOTH sides to the module root —
      # the root-CWD invocation alone breaks once a proto imports another (cross-package
      # imports resolve against the CWD as module root and fail with "imported file does
      # not exist"), e.g. the local IPC contract importing phonebridge/v1.
      - name: buf breaking
        run: buf breaking proto --against '.git#branch=main,subdir=proto'

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pion v4 (DEC-006/DEC-017): webrtc/v4 v4.2.20 declares `go 1.24.0`,
          # so 1.23 cannot build this module (see docs/decisions.md DEC-017).
          go-version: "1.24.x"
          cache-dependency-path: core/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1 -race

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: ui
        run: flutter pub get
      - working-directory: ui
        run: flutter analyze
      - working-directory: ui
        run: flutter test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files exist
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f docs/architecture.md
          test -f docs/security.md
          test -f docs/protocol.md
          test -f docs/development.md
          test -f docs/decisions.md
      - name: No GPL in manifests
        run: |
          ! grep -ri "GPL" core/go.mod ui/pubspec.yaml 2>/dev/null || (echo "GPL string found in manifests — review licensing" && exit 1)
          echo "GPL check passed"
      - name: Spike docs present
        run: |
          for f in 01-flutter-go-ipc-linux 02-flutter-kotlin-go-android 03-android-mediaprojection-encoder 04-pion-webrtc-android-linux 05-android-clipboard-background 06-cosmic-clipboard 07-cosmic-input 08-bidirectional-large-file 09-lan-discovery 10-remote-p2p-turn; do
            test -f "docs/spikes/$f.md" || (echo "missing docs/spikes/$f.md" && exit 1)
          done
          echo "All 10 spike docs present"
