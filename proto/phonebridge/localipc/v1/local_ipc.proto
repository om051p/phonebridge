// PhoneBridge Local IPC — v1
// Package: phonebridge.localipc.v1
// Status: CONFIRMED (Phase 0) — contract ratified from Spike 01 (DEC-018).
//         Session lifecycle extended in Phase 2 (DEC-022): requested/actual
//         media parameters and typed session reason codes.
//         Clipboard status/pull added in Phase 3 (DEC-023); file-transfer
//         RPCs and events added in Phase 4 (DEC-024).
// Source of truth for wire compatibility: this file + buf breaking checks.
//
// Scope and isolation rules (see docs/protocol.md):
// - This contract serves the SAME-USER, SAME-MACHINE boundary only:
//   Flutter UI <-> phonebridge daemon over a Unix domain socket.
// - It MUST NOT be exposed on any network listener and MUST NOT become part
//   of the device-to-device protocol (phonebridge.v1), which is a different
//   boundary with a different trust model. The daemon is the only component
//   that speaks both; StreamEventsResponse.envelope is opaque relay payload, not a
//   transport definition for phonebridge.v1.
// - phonebridge.spike.localipc.v1 (Spike 01) is a throwaway schema and was
//   never promoted; nothing here reuses it.
//
// Transport (ratified by Spike 01, DEC-018):
// - Socket: $XDG_RUNTIME_DIR/phonebridge/engine.sock
//   Directory created 0700, owned by the daemon's effective user; socket
//   file 0600. A stale socket from a crashed predecessor is removed at
//   startup only after verifying no live listener exists.
// - Gate 1 (primary, kernel-verified): SO_PEERCRED on every accepted
//   connection; peers whose UID differs from the daemon's effective UID are
//   rejected pre-auth (gRPC transport credentials).
// - Gate 2 (defense-in-depth): gRPC metadata
//   `authorization: Bearer <token>` on every call, constant-time compared.
//   Token provisioning and client acquisition mechanism:
//   1. Generation: At daemon startup, the daemon generates >= 256 bits of
//      cryptographically secure randomness from a CSPRNG (e.g. crypto/rand)
//      and writes it as a hex/ASCII string to $XDG_RUNTIME_DIR/phonebridge/token
//      (mode 0600, owned by the daemon's effective UID).
//   2. Client Discovery & Acquisition: The legitimate Flutter UI client,
//      executing as the same OS user, resolves the token file path
//      ($XDG_RUNTIME_DIR/phonebridge/token). If the file is not yet present at
//      client launch, the client polls with exponential backoff (e.g. 50ms,
//      100ms, up to 3s) until the daemon signals READY. The client reads the
//      token from the file into memory.
//   3. RPC Authentication: The client attaches the token to every gRPC call
//      via metadata: `authorization: Bearer <token>` (e.g., via grpc-dart
//      CallOptions(metadata: {'authorization': 'Bearer $token'})).
//   4. Rotation & Re-auth: The token rotates on every daemon start. When the
//      client receives gRPC status UNAUTHENTICATED (code 16), it invalidates
//      its in-memory token cache, re-reads the token file from disk, and
//      re-establishes the connection with backoff.
//   The bearer token covers socket-permission misconfiguration (e.g.
//   accidentally world-accessible socket files) and cross-namespace or
//   container leaks; on a correctly configured system under POSIX DAC the
//   uid gate is the primary boundary.
// - Lifecycle: the daemon is a foreground process (systemd user service
//   Type=simple, Restart=on-failure); SIGTERM -> graceful stop, streams end
//   cleanly, socket removed. Clients reconnect with backoff; continuity is
//   detected via HandshakeResponse.daemon_generation and StreamEventsResponse.seq.
// - Payloads: gRPC's default 4 MiB message ceiling applies. Bulk content
//   (file bytes, large clipboard bodies) MUST additionally be chunked at
//   <= 64 KiB per message (Spike 01: a 64 KiB message costs ~2x a small
//   one; chunking bounds relay latency and head-of-line blocking).

syntax = "proto3";

package phonebridge.localipc.v1;

import "phonebridge/v1/phonebridge.proto";

option go_package = "github.com/om051p/phonebridge/core/pkg/protocol/phonebridgelocalipcv1;phonebridgelocalipcv1";
option java_multiple_files = true;
option java_package = "dev.phonebridge.proto.localipc.v1";

// ---------------------------------------------------------------------------
// LocalEngineService — the UI-facing engine service on the local Unix socket.
// ---------------------------------------------------------------------------
service LocalEngineService {
  // Handshake negotiates the local protocol version and returns daemon
  // identity. Must be the first call on a new connection.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  // Ping is a cheap liveness/reconnect probe.
  rpc Ping(PingRequest) returns (PingResponse);

  // StreamEvents pushes relayed device-protocol messages to the UI.
  // Server-streaming; the daemon ends the stream cleanly on shutdown, and
  // the client re-subscribes with backoff after any stream end.
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse);

  // Health reports daemon readiness without opening an event stream.
  rpc Health(HealthRequest) returns (HealthResponse);

  // StartSession initiates a new connection session with a discovered phone.
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);

  // StopSession cleanly terminates an active session.
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);

  // GetSessionState queries the current phase, device, and metrics of a session.
  rpc GetSessionState(GetSessionStateRequest) returns (GetSessionStateResponse);

  // ListDevices returns all currently discovered LAN devices from mDNS.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);

  // PairDevice initiates pairing with a discovered LAN device.
  rpc PairDevice(PairDeviceRequest) returns (PairDeviceResponse);
  // ConfirmPairing completes pairing by confirming the SAS.

  rpc ConfirmPairing(ConfirmPairingRequest) returns (ConfirmPairingResponse);

  // ListInboundPairings returns pairing requests awaiting this device's approval.

  rpc ListInboundPairings(ListInboundPairingsRequest) returns (ListInboundPairingsResponse);

  // RespondInboundPairing records approval or rejection of one inbound request.

  rpc RespondInboundPairing(RespondInboundPairingRequest) returns (RespondInboundPairingResponse);

  // ListTrustedDevices returns all trusted/paired devices.
  rpc ListTrustedDevices(ListTrustedDevicesRequest) returns (ListTrustedDevicesResponse);

  // RevokeDevice revokes trust for a previously paired device.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);

  // RemoveDevice permanently deletes a trusted record (Forget Device).
  // Unlike RevokeDevice — which preserves the revoked row for audit — this
  // removes it. Reuses the revoke messages: no new payload shape.
  rpc RemoveDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);

  // GetClipboardStatus returns the current status of the host clipboard adapter and engine.
  rpc GetClipboardStatus(GetClipboardStatusRequest) returns (GetClipboardStatusResponse);

  // TriggerClipboardPull reads the host clipboard and synchronizes it to the active peer.
  rpc TriggerClipboardPull(TriggerClipboardPullRequest) returns (TriggerClipboardPullResponse);

  // SendFile offers a local file to the active peer over the session's
  // dedicated "transfer" DataChannel (DEC-024). The daemon reads local_path
  // itself: file bytes never cross this local boundary, and no whole file is
  // buffered anywhere (streaming chunked I/O).
  rpc SendFile(SendFileRequest) returns (SendFileResponse);

  // CancelTransfer aborts an in-flight transfer in either direction. The
  // cancel frame goes to the peer and the partial file is deleted locally.
  rpc CancelTransfer(CancelTransferRequest) returns (CancelTransferResponse);

  // ListTransfers returns in-flight transfers plus the recent in-memory
  // history (Phase 4 does not persist history across daemon restarts).
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse);

  // StreamFrames pushes encoded video frames of the active session to the UI
  // renderer (Phase 6 Slice 3, additive). Deliberately a SEPARATE stream from
  // StreamEvents: control events must never be starved or dropped by frame
  // traffic, and frames are opt-in per subscriber (one renderer at a time,
  // DEC-018's one-consumer rule). v1 carries JPEG frames produced by the
  // daemon-side tap; the message shape is transport-generic (chunked opaque
  // image bytes + geometry). The server ends the stream when the session it
  // is bound to reaches a terminal state; clients resubscribe via their
  // existing backoff pattern only while a session is live.
  rpc StreamFrames(StreamFramesRequest) returns (stream StreamFramesResponse);

  // SendInput injects a remote input event to the active peer over the session's
  // dedicated "input" DataChannel (Phase 7, DEC-027).
  rpc SendInput(SendInputRequest) returns (SendInputResponse);

  // ListNotifications returns the active in-memory mirrored notifications (Phase 8, DEC-028).
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);

  // DismissNotification requests dismissal of a mirrored notification on Android (Phase 8, DEC-028).
  rpc DismissNotification(DismissNotificationRequest) returns (DismissNotificationResponse);
}

// HandshakeRequest advertises the client's local-IPC protocol support.
message HandshakeRequest {
  // Highest phonebridge.localipc protocol version the client implements.
  // Currently always 1. The server negotiates down to its own maximum.
  uint32 client_version = 1;
}

// HandshakeResponse answers Handshake.
message HandshakeResponse {
  // Version selected for this connection: min(client_version, server max).
  // Currently always 1.
  uint32 negotiated_version = 1;

  // Daemon build/version string (informational identity for logs/debug).
  string server_version = 2;

  // Identifier of the daemon process instance. Changes on every daemon
  // (re)start; clients use it to detect daemon replacement across
  // reconnects. Matches StreamEventsResponse.daemon_generation on later streams.
  uint64 daemon_generation = 3;
}

// PingRequest carries a caller nonce for reply correlation.
message PingRequest {
  // Caller-chosen nonce, echoed in PingResponse.
  uint64 nonce = 1;
}

// PingResponse answers PingRequest.
message PingResponse {
  // Echo of PingRequest.nonce.
  uint64 nonce = 1;

  // Daemon build/version string (identity check after a reconnect).
  string server_version = 2;
}

// StreamEventsRequest subscribes to relayed device-protocol events.
// Intentionally empty in v1: future filters (event kinds, device ids) are
// added as optional fields; older servers ignore unknown fields.
message StreamEventsRequest {}

// StreamEventsResponse is one pushed message on the StreamEvents stream.
// (the "local event" of DEC-018; the type is named to satisfy the repo's STANDARD lint)
message StreamEventsResponse {
  // Per-stream monotonic sequence starting at 1. The local ordering
  // authority — clients detect gaps and must resubscribe/resync via Health.
  // (Distinct from Envelope.sequence, which orders the DEVICE session.)
  uint64 seq = 1;

  // Daemon instance identifier; equals HandshakeResponse.daemon_generation for the
  // serving daemon. A change means the daemon restarted under the client.
  uint64 daemon_generation = 2;

  // Opaque relayed device-protocol message (phonebridge.v1). The daemon
  // forwards the Envelope verbatim; the UI decodes device payloads
  // directly. Pass-through framing per DEC-018: this is payload relay,
  // NOT a new transport for phonebridge.v1, and LocalEngine is never a
  // device peer.
  phonebridge.v1.Envelope envelope = 3;

  // Local session state transitions (connecting, streaming, reconnecting, etc.).
  SessionEvent session_event = 4;

  // Clipboard subsystem status transitions (adapter status, active peer, etc.).
  ClipboardStatusEvent clipboard_event = 5;

  // File-transfer state/progress transitions (DEC-024).
  TransferEvent transfer_event = 6;

  // Mirrored notification events (Phase 8, DEC-028).
  phonebridge.v1.NotificationFrame notification_event = 7;

  // Inbound-pairing lifecycle transitions (Phase 2 bidirectional pairing).
  PairingEvent pairing_event = 8;
}

// LocalEvent represents a pushed local event containing the relayed device envelope.
// On the wire, StreamEvents yields StreamEventsResponse (whose fields match LocalEvent)
// to satisfy standard gRPC request/response naming conventions.
message LocalEvent {
  // Per-stream monotonic sequence starting at 1.
  uint64 seq = 1;

  // Daemon instance identifier; equals HandshakeResponse.daemon_generation.
  uint64 daemon_generation = 2;

  // Opaque relayed device-protocol message (phonebridge.v1).
  phonebridge.v1.Envelope envelope = 3;

  // Local session state transitions.
  SessionEvent session_event = 4;

  // Clipboard subsystem status transitions.
  ClipboardStatusEvent clipboard_event = 5;

  // File-transfer state/progress transitions (DEC-024).
  TransferEvent transfer_event = 6;

  // Mirrored notification events (Phase 8, DEC-028).
  phonebridge.v1.NotificationFrame notification_event = 7;

  // Inbound-pairing lifecycle transitions (Phase 2 bidirectional pairing).
  PairingEvent pairing_event = 8;
}

// HealthRequest is empty.
message HealthRequest {}

// HealthResponse answers Health.
message HealthResponse {
  // True once the daemon is serving (its READY state).
  bool ready = 1;

  // Daemon instance identifier (see HandshakeResponse.daemon_generation).
  uint64 daemon_generation = 2;

  // Daemon build/version string.
  string server_version = 3;

  // Milliseconds since daemon start (informational).
  uint64 uptime_ms = 4;
}

// ---------------------------------------------------------------------------
// Session state machine & RPCs (production LAN session lifecycle)
// ---------------------------------------------------------------------------

// SessionState models the 8 operational phases of a device session.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_DISCONNECTED = 1;
  SESSION_STATE_DISCOVERING = 2;
  SESSION_STATE_CONNECTING = 3;
  SESSION_STATE_CONNECTED = 4;
  SESSION_STATE_STREAMING = 5;
  SESSION_STATE_RECONNECTING = 6;
  SESSION_STATE_STOPPED = 7;
  SESSION_STATE_FAILED = 8;
}

// SessionReason is a typed classification of a session state change. It exists
// so the UI never parses prose: `reason` and `error_message` stay human-readable
// diagnostics, while `reason_code` is the machine-stable contract. The values
// are intentionally local to this contract even where they mirror
// phonebridge.v1.Code — the local session state machine has failure modes of
// its own (discovery, trust, reconnect budget) that the device protocol does
// not express.
enum SessionReason {
  SESSION_REASON_UNSPECIFIED = 0;
  // Explicitly "no failure": a normal transition (connecting, streaming,
  // user stop). Distinguished from UNSPECIFIED, which means the server did
  // not classify the transition at all.
  SESSION_REASON_NONE = 1;
  // The two devices have no protocol version in common (DEC-022 handshake).
  SESSION_REASON_PROTOCOL_VERSION_MISMATCH = 2;
  // The capture device could not satisfy the requested media parameters.
  SESSION_REASON_UNSUPPORTED_MEDIA_PARAMS = 3;
  // The peer is not in the trust store; pairing is required.
  SESSION_REASON_DEVICE_NOT_TRUSTED = 4;
  // The target device was not found within the discovery timeout.
  SESSION_REASON_DEVICE_NOT_FOUND = 5;
  // The peer already has an active session.
  SESSION_REASON_SESSION_BUSY = 6;
  // The user withdrew MediaProjection consent; the link is healthy but there
  // is no longer a screen to send (DEC-020).
  SESSION_REASON_CONSENT_REVOKED = 7;
  // Capture or encode failed on the sending device.
  SESSION_REASON_CAPTURE_FAILED = 8;
  // ICE/DTLS failed outside the reconnect budget.
  SESSION_REASON_TRANSPORT_FAILED = 9;
  // The bounded reconnect window elapsed without recovery.
  SESSION_REASON_RECONNECT_TIMEOUT = 10;
  // The LAN signaling exchange failed (HTTP/offer/answer).
  SESSION_REASON_SIGNALING_FAILED = 11;
  // The local user stopped the session.
  SESSION_REASON_USER_STOPPED = 12;
}

// SessionEvent represents a state transition pushed to StreamEvents subscribers.
message SessionEvent {
  string session_id = 1;
  SessionState state = 2;
  string reason = 3;
  string error_message = 4;
  // Typed classification of this transition (see SessionReason).
  SessionReason reason_code = 5;
}

// StartSessionRequest initiates a session with the specified target device.
message StartSessionRequest {
  // Unique target device ID (from mDNS discovery).
  string device_id = 1;
  // Screen-stream parameters the caller wants. Unset (or all-zero) fields
  // mean "use the daemon default". The capture device answers with the values
  // it actually applied; a request it cannot meet exactly is either reported
  // as a downgrade or rejected with SESSION_REASON_UNSUPPORTED_MEDIA_PARAMS.
  phonebridge.v1.MediaParams requested = 2;
}

// StartSessionResponse returns the newly initiated session identity and state.
message StartSessionResponse {
  string session_id = 1;
  SessionState state = 2;
}

// StopSessionRequest halts an active or in-progress session.
message StopSessionRequest {
  string session_id = 1;
  string reason = 2;
}

// StopSessionResponse confirms session termination.
message StopSessionResponse {
  string session_id = 1;
  SessionState state = 2;
}

// GetSessionStateRequest queries current session status.
message GetSessionStateRequest {
  string session_id = 1;
}

// StreamStats reports point-in-time WebRTC media and network counters.
message StreamStats {
  uint64 packets = 1;
  uint64 bytes_rtp = 2;
  uint64 bytes_h264 = 3;
  uint64 access_units = 4;
  uint64 keyframes = 5;
  int64 dropped_aus = 6;
  // Transport counters from the receiver's depacketizer. They exist with
  // stable semantics in rtpmedia.StreamStats and are surfaced so link-quality
  // regressions are observable from the UI and from tests rather than only
  // from daemon logs.
  uint64 seq_gaps = 7;
  uint64 dup_seq = 8;
  uint64 late_packets = 9;
  uint64 ts_backward = 10;
}

// SinkKind classifies where a session's decoded frames are written, so the
// UI reports the real display path instead of assuming ffplay is running (a
// headless daemon silently uses a null sink).
enum SinkKind {
  SINK_KIND_UNSPECIFIED = 0;
  SINK_KIND_NULL = 1;
  SINK_KIND_DISPLAY = 2;
  SINK_KIND_PIPE = 3;
  SINK_KIND_FILE = 4;
}

// GetSessionStateResponse contains a full point-in-time snapshot.
message GetSessionStateResponse {
  string session_id = 1;
  SessionState state = 2;
  string device_id = 3;
  uint64 connected_duration_ms = 4;
  string error_message = 5;
  StreamStats stats = 6;
  // What the caller asked for when the session was started.
  phonebridge.v1.MediaParams requested = 7;
  // What the capture device actually applied (authoritative, DEC-020). An
  // `actual` that differs from `requested` is a reported downgrade, never a
  // silent substitution. Both are unset until negotiation completes.
  phonebridge.v1.MediaParams actual = 8;
  // Typed classification of the current state (see SessionReason).
  SessionReason reason_code = 9;
  // Reconnect attempts made in the current recovery window (0 when healthy).
  // Exposed so recovery is observable from the UI and from tests rather than
  // inferred from a state label.
  uint32 reconnect_attempts = 10;
  // Which frame sink the session is writing to, and whether it is currently
  // attached. The daemon clears both when the session reaches a terminal
  // state, so a stale sink can never outlive its session.
  SinkKind sink_kind = 11;
  bool sink_active = 12;
  // Typed reason why the in-app frame stream is (or is not) producing
  // frames — empty while frames flow normally. Uppercase codes, e.g.
  // "FFMPEG_MISSING" (tap degraded, P4) or "PARAM_SETS_MISSING" (received
  // stream carries no SPS/PPS and none was ever cached). Lets the UI
  // distinguish "no frames yet" from a diagnosed condition instead of
  // showing an unexplained blank surface.
  string frames_reason = 13;
  // What the capture device advertised it can do, as reported in the DEC-022
  // offer exchange (phonebridge.v1.MediaCapabilities from the encoder the
  // device actually selected — Android CodecSelector, never a constant).
  // Unset until a negotiation with this peer has reported it, and unset again
  // for peer-started sessions whose offer carried none: an absent tuple means
  // "not reported", which the UI renders as "Checking device capabilities…"
  // rather than guessing availability.
  phonebridge.v1.MediaCapabilities capabilities = 14;
}

// DiscoveredDevice models a LAN device discovered via mDNS.
message DiscoveredDevice {
  string id = 1;
  string name = 2;
  string model = 3;
  string version = 4;
  repeated string capabilities = 5;
  string state = 6;
  string address = 7;
  uint32 port = 8;
  bool is_stale = 9;
}

// ListDevicesRequest is empty.
message ListDevicesRequest {}

// ListDevicesResponse returns currently known LAN devices.
message ListDevicesResponse {
  repeated DiscoveredDevice devices = 1;
}

// PairDeviceRequest initiates pairing with a device.
message PairDeviceRequest {
  string device_id = 1;
}

// PairDeviceResponse returns the pairing status and SAS for user verification.
message PairDeviceResponse {
  string device_id = 1;
  string display_name = 2;
  string sas = 3;
  bool pending_confirmation = 4;
}

// ConfirmPairingRequest conveys user confirmation of the SAS.
message ConfirmPairingRequest {
  string device_id = 1;
  bool user_confirmed = 2;
}

// ConfirmPairingResponse returns the result of the pairing confirmation.
message ConfirmPairingResponse {
  string device_id = 1;
  bool success = 2;
  string error_message = 3;
}

// InboundPairingRequest is one pairing request awaiting the local user's
// explicit approval. Trust is committed only after RespondInboundPairing
// approves AND the requester's signed confirm verifies.
message InboundPairingRequest {
  // Opaque token identifying the request; passed back to RespondInboundPairing.
  string pairing_token = 1;
  string remote_name = 2;
  string remote_platform = 3;
  // Short Authentication String the local user compares with the requester's
  // screen before approving.
  string sas = 4;
  int64 created_at_ms = 5;
}

// ListInboundPairingsRequest is empty.
message ListInboundPairingsRequest {}

// ListInboundPairingsResponse lists inbound requests awaiting approval.
// Expired entries are swept and omitted, so the UI auto-dismisses stale
// dialogs by refreshing this list.
message ListInboundPairingsResponse {
  repeated InboundPairingRequest requests = 1;
}

// RespondInboundPairingRequest records the local user's decision.
message RespondInboundPairingRequest {
  string pairing_token = 1;
  bool approved = 2;
}

// RespondInboundPairingResponse confirms the decision was recorded. Approval
// alone never commits trust: the requester's signed confirm must still verify.
message RespondInboundPairingResponse {
  string pairing_token = 1;
  bool recorded = 2;
}

// PairingEventType classifies an inbound-pairing lifecycle transition.
enum PairingEventType {
  PAIRING_EVENT_TYPE_UNSPECIFIED = 0;
  // A new inbound request arrived and awaits approval.
  PAIRING_EVENT_TYPE_ARRIVED = 1;
  // A previously pending request is gone (withdrawn by the requester,
  // answered locally, or expired). Refresh ListInboundPairings for truth.
  PAIRING_EVENT_TYPE_WITHDRAWN = 2;
}

// PairingEvent pushes inbound-pairing transitions to StreamEvents subscribers.
message PairingEvent {
  PairingEventType type = 1;
  // Token of the affected request; receivers refresh the list instead of
  // tracking tokens across restarts.
  string pairing_token = 2;
}

// TrustedDevice represents a paired device in the persistent trust store.
message TrustedDevice {
  string device_id = 1;
  string display_name = 2;
  string platform = 3;
  bytes public_key = 4;
  int64 paired_at_ms = 5;
  int64 last_seen_ms = 6;
  bool revoked = 7;
}

// ListTrustedDevicesRequest is empty.
message ListTrustedDevicesRequest {}

// ListTrustedDevicesResponse lists all paired devices.
message ListTrustedDevicesResponse {
  repeated TrustedDevice devices = 1;
}

// RevokeDeviceRequest requests revocation of a paired device.
message RevokeDeviceRequest {
  string device_id = 1;
}

// RevokeDeviceResponse confirms revocation.
message RevokeDeviceResponse {
  string device_id = 1;
  bool success = 2;
}

// ---------------------------------------------------------------------------
// Clipboard subsystem IPC definitions (DEC-023)
// ---------------------------------------------------------------------------

// GetClipboardStatusRequest is empty.
message GetClipboardStatusRequest {}

// GetClipboardStatusResponse returns the current clipboard engine and adapter state.
message GetClipboardStatusResponse {
  // Operational state of the clipboard subsystem: "READY", "AMBIENT_ACTIVE", "STOPPED", "COSMIC_FLAG_REQUIRED", "NO_DATA_CONTROL", "WAYLAND_UNAVAILABLE", etc.
  string state = 1;

  // True if an active clipboard WebRTC DataChannel transport is connected.
  bool is_connected = 2;

  // Maximum allowed clipboard payload in bytes (DEC-023: 786432).
  uint32 max_payload_size = 3;

  // Identifier of the remote peer currently connected for clipboard sync, if any.
  string remote_peer_id = 4;

  // Status string specific to the platform adapter (e.g. Wayland data-control status).
  string adapter_status = 5;

  // Last sync timestamp in ms since Unix epoch, or 0 if unknown.
  uint64 last_sync_ms = 6;
}

// TriggerClipboardPullRequest requests a manual read from the host clipboard to sync to remote peer.
message TriggerClipboardPullRequest {}

// TriggerClipboardPullResponse returns the result of the manual clipboard pull.
message TriggerClipboardPullResponse {
  bool success = 1;
  string error_message = 2;
}

// ClipboardStatusEvent represents a pushed clipboard status update on StreamEvents.
message ClipboardStatusEvent {
  string state = 1;
  bool is_connected = 2;
  string adapter_status = 3;
  string remote_peer_id = 4;
  uint32 max_payload_size = 5;
}

// ---------------------------------------------------------------------------
// File-transfer subsystem IPC definitions (DEC-024, Phase 4)
// ---------------------------------------------------------------------------
// These types are deliberately local to this contract, mirroring the
// SessionState/SessionReason precedent: the daemon's transfer state machine has
// failure modes of its own (storage policy, local cancel, SAF/MediaStore) that
// the device protocol expresses as phonebridge.v1.Code instead.

// TransferDirection states which way the bytes flow for this device.
enum TransferDirection {
  TRANSFER_DIRECTION_UNSPECIFIED = 0;
  // This device sends the file.
  TRANSFER_DIRECTION_OUTBOUND = 1;
  // This device receives the file.
  TRANSFER_DIRECTION_INBOUND = 2;
}

// TransferState is the lifecycle phase of one transfer.
enum TransferState {
  TRANSFER_STATE_UNSPECIFIED = 0;
  // Offer sent (outbound) or received (inbound); awaiting FileAccept.
  TRANSFER_STATE_PENDING = 1;
  // Chunks are flowing.
  TRANSFER_STATE_ACTIVE = 2;
  // All chunks received; verifying size/digest and promoting the file.
  TRANSFER_STATE_VERIFYING = 3;
  // Terminal success: the file was committed at the destination.
  TRANSFER_STATE_COMPLETE = 4;
  // Terminal: cancelled locally or by the peer.
  TRANSFER_STATE_CANCELLED = 5;
  // Terminal: failed (integrity, storage, interruption, protocol, policy).
  TRANSFER_STATE_FAILED = 6;
}

// TransferReason is the typed classification of a non-success outcome, so the
// UI never parses prose. SESSION-style distinction applies: NONE is an
// explicitly normal outcome, UNSPECIFIED means the daemon did not classify.
enum TransferReason {
  TRANSFER_REASON_UNSPECIFIED = 0;
  // No failure (normal progress or completion).
  TRANSFER_REASON_NONE = 1;
  // No active session with a peer that supports file transfer.
  TRANSFER_REASON_NO_SESSION = 2;
  // The peer does not advertise file transfer (no "transfer" DataChannel).
  TRANSFER_REASON_UNSUPPORTED_PEER = 3;
  // A transfer is already in flight in that direction (DEC-024 limit).
  TRANSFER_REASON_BUSY = 4;
  // The proposed filename is not a plain basename.
  TRANSFER_REASON_UNSAFE_FILENAME = 5;
  // The file exceeds the configured size policy.
  TRANSFER_REASON_TOO_LARGE = 6;
  // Size or SHA-256 did not match; nothing was committed.
  TRANSFER_REASON_CHECKSUM_MISMATCH = 7;
  // Destination write/promotion failed (space, permission, MediaStore/SAF).
  TRANSFER_REASON_STORAGE_FAILED = 8;
  // The transport/session went away mid-transfer; retry restarts from zero.
  TRANSFER_REASON_INTERRUPTED = 9;
  // The peer cancelled.
  TRANSFER_REASON_CANCELLED_BY_PEER = 10;
  // The local user cancelled.
  TRANSFER_REASON_CANCELLED_BY_USER = 11;
  // A wire frame violated the protocol (wrong index/offset/state).
  TRANSFER_REASON_PROTOCOL_ERROR = 12;
  // The peer speaks a transfer frame version this build does not implement.
  TRANSFER_REASON_INCOMPATIBLE_VERSION = 13;
}

// TransferInfo is the UI-facing snapshot of one transfer (in-flight or in the
// recent history).
message TransferInfo {
  string transfer_id = 1;
  TransferDirection direction = 2;
  TransferState state = 3;
  // Peer device identity this transfer belongs to.
  string peer_device_id = 4;
  // Original filename proposed by the sender (basename).
  string filename = 5;
  // Canonical MIME type when known; empty otherwise.
  string mime_type = 6;
  // Total bytes (0 while unknown for an inbound offer that was never parsed).
  uint64 size_bytes = 7;
  // Bytes transferred so far (clamped to size_bytes).
  uint64 bytes_transferred = 8;
  uint64 started_at_ms = 9;
  // 0 while in flight.
  uint64 finished_at_ms = 10;
  TransferReason reason_code = 11;
  // Human-readable detail for logs and UI; never parsed.
  string error_message = 12;
  // Basename the receiving side stored (post collision rename); empty for
  // outbound transfers and until commit.
  string saved_name = 13;
}

// SendFileRequest offers a local file to the currently connected peer.
message SendFileRequest {
  // Target device id. Empty means "the active session's peer" — accepted only
  // when a session is active, so the UI cannot accidentally target a device
  // that is merely discovered.
  string device_id = 1;
  // Absolute local path of a regular, readable file (Linux). The daemon reads
  // it directly; it is never transferred over local IPC.
  string local_path = 2;
  // Optional display name override; empty means "use the file's basename".
  string filename = 3;
}

// SendFileResponse returns the new transfer identity.
message SendFileResponse {
  string transfer_id = 1;
  // First state of the transfer (PENDING in the normal case).
  TransferState state = 2;
  // Typed failure when the offer could not be started.
  TransferReason reason_code = 3;
  string error_message = 4;
}

// CancelTransferRequest aborts an in-flight transfer.
message CancelTransferRequest {
  string transfer_id = 1;
}

// CancelTransferResponse confirms the cancellation request was handled.
message CancelTransferResponse {
  string transfer_id = 1;
  bool cancelled = 2;
  string error_message = 3;
}

// ListTransfersRequest is empty.
message ListTransfersRequest {}

// ListTransfersResponse returns in-flight transfers and the recent history,
// newest first.
message ListTransfersResponse {
  repeated TransferInfo transfers = 1;
}

// TransferEvent is one pushed transfer transition on StreamEvents.
message TransferEvent {
  TransferInfo transfer = 1;
}

// ---------------------------------------------------------------------------
// Screen-frame streaming (Phase 6 Slice 3, additive)
// ---------------------------------------------------------------------------
// No frame bytes ever ride StreamEvents (the DEC-018 control plane): a client
// that never calls StreamFrames sees zero behavior or wire change, and frame
// backpressure can never cost the UI a session/clipboard/transfer event.

// StreamFramesRequest subscribes to frames of the active session.
// Intentionally empty in v1: future filters (session id, fps cap, quality)
// are added as optional fields; older servers ignore unknown fields.
message StreamFramesRequest {}

// StreamFramesResponse carries one CHUNK of one JPEG frame. A frame larger
// than the DEC-018 bulk ceiling (<= 64 KiB per message) arrives as multiple
// chunks; chunk_count == 1 is not guaranteed by the contract even though it
// is the common case for 720p q3. Chunks of a frame are contiguous and
// ordered; the next frame_id begins only after the previous last_chunk.
message StreamFramesResponse {
  // Monotonic frame identity within this subscription, starting at 1.
  // Identical on every chunk of the same frame. Gaps are permitted and mean
  // the daemon dropped a frame under latest-wins backpressure — a gap is
  // never a reason to resubscribe or resynchronize.
  uint64 frame_id = 1;

  // 0-based position of this chunk within the frame.
  uint32 chunk_index = 2;

  // Total chunks composing this frame (>= 1). With frame_id this is the
  // ordering authority for reassembly.
  uint32 chunk_count = 3;

  // True on the final chunk (chunk_index == chunk_count - 1), so a renderer
  // can paint the instant the frame completes — explicit rather than derived,
  // so a frame that stops arriving is detectable client-side instead of
  // silently never rendering.
  bool last_chunk = 4;

  // Decoded dimensions of the complete frame in pixels. Present on every
  // chunk so a renderer can size its surface before the first frame completes.
  uint32 width = 5;
  uint32 height = 6;

  // JPEG byte slice of this chunk, <= 64 KiB per message (DEC-018 bulk rule;
  // chunking also bounds relay latency and head-of-line blocking).
  bytes jpeg = 7;

  // Daemon-local wall-clock time (µs since epoch) at which this frame was
  // produced by the daemon, present on every chunk. Same clock as the client
  // on a LAN host, so a renderer can compute true send→paint frame age for
  // telemetry without a clock-anchoring exchange. Diagnostics only: a client
  // must not reorder or drop frames because of it.
  uint64 sent_unix_micros = 8;
}

// SendInputRequest carries one InputFrame to be injected into the active session.
message SendInputRequest {
  string session_id = 1;
  phonebridge.v1.InputFrame frame = 2;
}

// SendInputResponse answers SendInput.
message SendInputResponse {
  bool delivered = 1;
  string error_message = 2;
}

// ---------------------------------------------------------------------------
// Notification mirroring IPC definitions (Phase 8, DEC-028)
// ---------------------------------------------------------------------------

// ListNotificationsRequest queries active mirrored notifications.
message ListNotificationsRequest {}

// ListNotificationsResponse returns the active notifications, newest first.
message ListNotificationsResponse {
  repeated phonebridge.v1.NotificationPosted notifications = 1;
}

// DismissNotificationRequest requests dismissal of a mirrored notification by key.
message DismissNotificationRequest {
  string key = 1;
}

// DismissNotificationResponse reports the outcome of the dismissal request.
message DismissNotificationResponse {
  bool success = 1;
  string error = 2;
}


